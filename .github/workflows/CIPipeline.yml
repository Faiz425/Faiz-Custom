name: automating image push to dockerhub

on:
  push:
  workflow_call:
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
  env:
    DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  run: |
    printf '%s' "$DOCKER_PASSWORD" | docker login docker.io -u "$DOCKER_USERNAME" --password-stdin

      - name: Build and Publish
        run: |
          registry=faiz134
          sha=$(git rev-parse --short HEAD)
          primary_Tag="$registry/ci-cd-pipeline:${sha}"

          docker build -t $primary_Tag -f Dockerfile .
          docker push $primary_Tag